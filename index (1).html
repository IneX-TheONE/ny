<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Мета-ксилол: ловец формул</title>
<style>
:root{--bg:#eeeeee;--ink:#2f2b29;--green:#61a58c;--deep:#3f7a64;--grey:#6b7f77;--bad:#d4493f;--gold:#e0a82e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;background:var(--green);color:#fff;font-size:clamp(16px,2.4vw,32px);font-weight:600}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:absolute;inset:0;background:rgba(238,238,238,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 6vw}
#ov.hidden{display:none}
h1{font-size:clamp(32px,6.5vw,90px);margin:0 0 10px;font-weight:600}
h2{font-size:clamp(22px,3.4vw,48px);margin:0 0 2vh;font-weight:600}
p{font-size:clamp(16px,2.1vw,28px);margin:0 0 2.5vh;color:var(--grey);max-width:980px;line-height:1.35}
input{font:inherit;font-size:clamp(20px,3vw,38px);padding:12px 20px;border-radius:16px;border:3px solid var(--green);text-align:center;width:min(500px,90vw);background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:clamp(20px,3vw,40px);padding:16px 48px;margin-top:2.5vh}
.big{font-size:clamp(70px,15vw,200px);font-weight:700;color:var(--deep);line-height:1;margin:1vh 0 2vh}
.grade{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;font-size:clamp(28px,5vw,70px);padding:6px 40px;border-radius:24px;margin-bottom:2vh}
.grade.low{background:var(--bad);color:#fff}
</style>
</head>
<body>
<header><span id="who">Ловец формул</span><span id="score">0 очков</span></header>
<div id="stage"><canvas id="cv"></canvas><div id="ov"></div></div>
<script>
/* Настройки */
const GOOD_POINTS=625;   // за верную карточку (16 × 625 = 10000)
const BAD_PENALTY=400;   // штраф за неверную карточку (ниже 0 очки не падают)

const GOOD=["C₈H₁₀","Метильные группы в положении 1,3","Кипит при ≈ 139 °C","Окисление → изофталевая кислота","Органический растворитель","Для полиэфирных смол","Получают при переработке нефти","Ароматический углеводород","Горит: CO₂ + H₂O","Для красок и лаков","Плавится при ≈ −47 °C","Плотность ≈ 0,86 г/см³","Легковоспламеняющийся","Содержит бензольное кольцо","Смешивается с органическими растворителями","Для пластмасс и покрытий"];
const BAD=["C₆H₆","Метильные группы в положении 1,4","Кипит при ≈ 78 °C","Окисление → уксусная кислота","Хорошо растворим в воде","Негорючая жидкость","Плотность ≈ 1,86 г/см³","Относится к алканам","Получают из морской воды","Применяют как пищевой краситель","Плавится при ≈ +100 °C","При горении даёт только H₂","Тяжелее воды","Газ при комнатной температуре"];
const TOTAL=GOOD.length+BAD.length;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const scoreEl=document.getElementById('score'),whoEl=document.getElementById('who');
let W=0,H=0,name="",state="menu";
let score=0,items=[],pops=[],queue=[],spawned=0,spawnT=0,caughtGood=0,flask=null,flash=0,keys={},last=0;

function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(flask){flask.y=H-flask.h-8}}
addEventListener('resize',resize);

const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const cw=()=>Math.max(150,Math.min(W*0.19,270));

/* Управление: палец/мышь по полю или стрелки */
function move(e){const r=cv.getBoundingClientRect();if(flask)flask.tx=e.clientX-r.left}
cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});

function menu(){
 state="menu";score=0;scoreEl.textContent="0 очков";whoEl.textContent="Ловец формул";
 ctx.clearRect(0,0,W,H);
 ov.className="";
 ov.innerHTML='<h1>ЛОВЕЦ ФОРМУЛ</h1><p>С неба падают карточки про мета-ксилол. Двигай колбу пальцем или мышкой и лови только <b>верные</b> утверждения. Верная карточка: +'+GOOD_POINTS+'. Неверная: −'+BAD_PENALTY+'. Максимум — 10000 очков.</p><input id="nm" placeholder="Введите имя игрока" maxlength="24"><button id="go">Играть</button>';
 document.getElementById('go').onclick=()=>{name=document.getElementById('nm').value.trim();start()};
}

function start(){
 resize();
 const fw=cw()*1.3,fh=fw*0.75;
 flask={x:W/2,tx:W/2,w:fw,h:fh,y:H-fh-8};
 items=[];pops=[];spawned=0;spawnT=1;caughtGood=0;flash=0;score=0;scoreEl.textContent="0 очков";
 queue=shuffle(GOOD.map(t=>({t,good:true})).concat(BAD.map(t=>({t,good:false}))));
 whoEl.textContent=name||"Игрок";
 ov.className="hidden";state="play";last=performance.now();
}

function wrap(text,maxW,font){
 ctx.font=font;const words=text.split(' '),lines=[];let cur="";
 for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 lines.push(cur);return lines;
}

function spawn(){
 const q=queue.shift(),w=cw(),fs=Math.round(Math.max(16,Math.min(w*0.115,28)));
 const font='600 '+fs+'px "Segoe UI",Roboto,Arial,sans-serif';
 const lines=wrap(q.t,w-24,font),h=lines.length*fs*1.25+26;
 items.push({t:q.t,good:q.good,lines,font,fs,w,h,x:w/2+10+Math.random()*(W-w-20),y:-h,done:false});
 spawned++;
}

function update(dt){
 const p=spawned/TOTAL;
 spawnT-=dt;
 if(queue.length&&spawnT<=0){spawn();spawnT=1.75-0.45*p}
 const speed=H/(5.8-1.5*p);
 const dir=((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0);
 if(dir)flask.tx=Math.max(0,Math.min(W,flask.tx+dir*W*0.9*dt));
 flask.x+=(flask.tx-flask.x)*Math.min(1,dt*16);
 flask.x=Math.max(flask.w/2,Math.min(W-flask.w/2,flask.x));
 for(const it of items){
  it.y+=speed*dt;
  if(!it.done&&it.y+it.h>=flask.y+flask.h*0.08){
   it.done=true;
   if(Math.abs(it.x-flask.x)<flask.w/2){
    it.gone=true;
    if(it.good){score+=GOOD_POINTS;caughtGood++;flash=0.35;pops.push({x:it.x,y:flask.y,t:"+"+GOOD_POINTS,c:"#2e9e5b",l:1})}
    else{score=Math.max(0,score-BAD_PENALTY);flash=-0.35;pops.push({x:it.x,y:flask.y,t:"−"+BAD_PENALTY+" неверно!",c:"#d4493f",l:1.2})}
    scoreEl.textContent=score+" очков";
   }
  }
 }
 items=items.filter(it=>!it.gone&&it.y<H+20);
 for(const pp of pops){pp.y-=60*dt;pp.l-=dt}
 pops=pops.filter(pp=>pp.l>0);
 if(flash>0)flash=Math.max(0,flash-dt);else if(flash<0)flash=Math.min(0,flash+dt);
 if(!queue.length&&!items.length&&!pops.length)end();
}

function flaskPath(f){
 const top=f.y,neck=f.y+f.h*0.3,bot=f.y+f.h,nw=f.w*0.17,x=f.x;
 ctx.beginPath();ctx.moveTo(x-nw,top);ctx.lineTo(x+nw,top);ctx.lineTo(x+nw,neck);ctx.lineTo(x+f.w/2,bot-12);
 ctx.quadraticCurveTo(x+f.w/2,bot,x+f.w/2-12,bot);ctx.lineTo(x-f.w/2+12,bot);ctx.quadraticCurveTo(x-f.w/2,bot,x-f.w/2,bot-12);ctx.lineTo(x-nw,neck);ctx.closePath();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#2f2b29";ctx.font='600 '+Math.max(15,Math.min(W*0.025,26))+'px "Segoe UI",Roboto,Arial,sans-serif';ctx.textAlign="left";
 ctx.fillText("Верных поймано: "+caughtGood+" из "+GOOD.length,14,28);
 for(const it of items){
  const x=it.x-it.w/2;
  ctx.fillStyle="#fff";ctx.strokeStyle="#61a58c";ctx.lineWidth=4;
  ctx.beginPath();ctx.roundRect(x,it.y,it.w,it.h,14);ctx.fill();ctx.stroke();
  ctx.fillStyle="#2f2b29";ctx.font=it.font;ctx.textAlign="center";ctx.textBaseline="middle";
  it.lines.forEach((l,k)=>ctx.fillText(l,it.x,it.y+13+it.fs*0.62+k*it.fs*1.25));
  ctx.textBaseline="alphabetic";
 }
 if(flask){
  const f=flask;
  ctx.save();flaskPath(f);ctx.clip();
  ctx.fillStyle="#fff";ctx.fillRect(f.x-f.w,f.y,f.w*2,f.h);
  const lvl=f.h*0.62*(score/10000)+f.h*0.06;
  ctx.fillStyle=flash>0?"#3fbf76":flash<0?"#d4493f":"#61a58c";
  ctx.fillRect(f.x-f.w,f.y+f.h-lvl,f.w*2,lvl);
  ctx.restore();
  flaskPath(f);ctx.strokeStyle="#2f2b29";ctx.lineWidth=6;ctx.lineJoin="round";ctx.stroke();
 }
 for(const pp of pops){
  ctx.globalAlpha=Math.min(1,pp.l);ctx.fillStyle=pp.c;ctx.font='700 '+Math.max(22,Math.min(W*0.04,44))+'px "Segoe UI",Roboto,Arial,sans-serif';ctx.textAlign="center";
  ctx.fillText(pp.t,Math.max(100,Math.min(W-100,pp.x)),pp.y);ctx.globalAlpha=1;
 }
}

function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(state==="play"){update(dt);draw();}
 requestAnimationFrame(loop);
}

function end(){
 state="end";
 const g=score>=10000?5:score>=7500?4:score>=5000?3:2;
 const txt={5:"Идеально! Ни одной ошибки и ни одной пропущенной карточки.",4:"Отличный результат!",3:"Хорошо, но можно лучше.",2:"Нужно повторить тему."}[g];
 ov.className="";
 ov.innerHTML='<p>'+(name?name+', ваш':'Ваш')+' результат</p><div class="big" id="cnt">0</div><div class="grade'+(g===2?' low':'')+'">Оценка: '+g+'</div><h2>'+txt+'</h2><p>Верных поймано: '+caughtGood+' из '+GOOD.length+'</p><button id="r">Следующий игрок</button>';
 document.getElementById('r').onclick=menu;
 const cnt=document.getElementById('cnt'),s0=performance.now();
 (function step(now){const p=Math.min(1,(now-s0)/1800);cnt.textContent=Math.round(score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(s0);
}

resize();menu();requestAnimationFrame(loop);
</script>
</body>
</html>
